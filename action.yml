name: GitLeak Radar
description: Scan repositories for leaked secrets
author: gecekusu1979

branding:
  icon: key
  color: purple

inputs:
  path:
    description: 'Directory to scan'
    required: false
    default: '.'
  version:
    description: 'Pinned gitleak-radar npm version. Bump this deliberately on each release for reproducible scans.'
    required: false
    default: '1.4.1'
  severity:
    description: 'Minimum severity threshold (low, medium, high, critical)'
    required: false
    default: 'low'
  since:
    description: 'Only scan files changed since this Git ref (e.g. origin/main). Leave empty for a full scan.'
    required: false
    default: ''
  staged:
    description: 'Scan only staged files in the Git index'
    required: false
    default: 'false'
  history:
    description: 'Scan the full Git commit history'
    required: false
    default: 'false'
  baseline:
    description: 'Path to a baseline file to suppress previously accepted findings'
    required: false
    default: ''
  max-file-size:
    description: 'Maximum file size to scan (e.g. 5MB)'
    required: false
    default: ''
  rules:
    description: 'Path to a custom rules JSON file'
    required: false
    default: ''
  sarif-file:
    description: 'Path to write the SARIF report'
    required: false
    default: 'gitleak-radar-results.sarif'
  upload-sarif:
    description: 'Automatically upload the SARIF report to the GitHub Security tab'
    required: false
    default: 'true'
  upload-artifact:
    description: 'Upload the SARIF report as a workflow artifact'
    required: false
    default: 'false'
  artifact-name:
    description: 'Name of the SARIF workflow artifact'
    required: false
    default: 'gitleak-radar-results'
  fail-on-findings:
    description: 'Fail this step when secrets are found (exit code 1)'
    required: false
    default: 'true'
  pr-comment:
    description: 'Post a detailed summary comment on Pull Requests (requires github-token)'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub token for posting PR comments (e.g. secrets.GITHUB_TOKEN)'
    required: false
    default: ''

outputs:
  findings-count:
    description: 'Number of findings reported in the SARIF output'
    value: ${{ steps.scan.outputs.findings-count }}
  exit-code:
    description: 'Raw gitleak-radar exit code (0=clean, 1=findings, 2=tool error)'
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '24'

    - name: Install GitLeak Radar
      shell: bash
      env:
        GITLEAK_RADAR_VERSION: ${{ inputs.version }}
      run: |
        if [[ ! "$GITLEAK_RADAR_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::version must be an exact semantic version."
          exit 2
        fi
        npm install --global --ignore-scripts --no-audit --no-fund "gitleak-radar@$GITLEAK_RADAR_VERSION"

    - name: Run GitLeak Radar
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_SEVERITY: ${{ inputs.severity }}
        INPUT_SINCE: ${{ inputs.since }}
        INPUT_STAGED: ${{ inputs.staged }}
        INPUT_HISTORY: ${{ inputs.history }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_MAX_FILE_SIZE: ${{ inputs.max-file-size }}
        INPUT_RULES: ${{ inputs.rules }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
        INPUT_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        INPUT_UPLOAD_ARTIFACT: ${{ inputs.upload-artifact }}
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        case "$INPUT_SEVERITY" in
          low|medium|high|critical) ;;
          *) echo "::error::severity must be low, medium, high, or critical."; exit 2 ;;
        esac

        for boolean_input in INPUT_STAGED INPUT_HISTORY INPUT_FAIL_ON_FINDINGS INPUT_UPLOAD_ARTIFACT; do
          case "${!boolean_input}" in
            true|false) ;;
            *) echo "::error::$boolean_input must be true or false."; exit 2 ;;
          esac
        done

        if [ -z "$INPUT_ARTIFACT_NAME" ] || [[ "$INPUT_ARTIFACT_NAME" == *'/'* || "$INPUT_ARTIFACT_NAME" == *'\'* ]]; then
          echo "::error::artifact-name must be non-empty and must not contain path separators."
          exit 2
        fi

        set +e

        ARGS=(scan "$INPUT_PATH" --severity "$INPUT_SEVERITY" --github-actions --sarif "$INPUT_SARIF_FILE")

        if [ -n "$INPUT_SINCE" ]; then ARGS+=(--since "$INPUT_SINCE"); fi
        if [ "$INPUT_STAGED" = "true" ]; then ARGS+=(--staged); fi
        if [ "$INPUT_HISTORY" = "true" ]; then ARGS+=(--history); fi
        if [ -n "$INPUT_BASELINE" ]; then ARGS+=(--baseline "$INPUT_BASELINE"); fi
        if [ -n "$INPUT_MAX_FILE_SIZE" ]; then ARGS+=(--max-file-size "$INPUT_MAX_FILE_SIZE"); fi
        if [ -n "$INPUT_RULES" ]; then ARGS+=(--rules "$INPUT_RULES"); fi

        gitleak-radar "${ARGS[@]}"
        EXIT_CODE=$?

        set -e

        FINDINGS=$(SARIF_PATH="$INPUT_SARIF_FILE" node -e "
          try {
            const d = JSON.parse(require('fs').readFileSync(process.env.SARIF_PATH, 'utf-8'));
            console.log(d.runs?.[0]?.results?.length ?? 0);
          } catch {
            console.log(0);
          }
        ")

        echo "findings-count=$FINDINGS" >> "$GITHUB_OUTPUT"
        echo "exit-code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

        if [ -n "$GITHUB_STEP_SUMMARY" ]; then
          SARIF_PATH="$INPUT_SARIF_FILE" SUMMARY_PATH="$GITHUB_STEP_SUMMARY" node <<'NODE'
const fs = require('fs');
const sarifPath = process.env.SARIF_PATH;
const summaryPath = process.env.SUMMARY_PATH;
const escapeMarkdown = (value) => String(value ?? 'unknown')
  .replace(/[`|\\\r\n]/g, (character) => `\\${character}`);

try {
  const sarif = JSON.parse(fs.readFileSync(sarifPath, 'utf8'));
  const results = sarif.runs?.[0]?.results || [];
  let summary = '## 🛡️ GitLeak Radar Scan\n\n';
  summary += results.length === 0
    ? '✅ **No secrets detected.**\n\n'
    : `⚠️ **${results.length} potential secret(s) detected.**\n\n`;
  summary += `- **Scanner:** \`gitleak-radar\`\n`;
  summary += `- **SARIF report:** \`${escapeMarkdown(sarifPath)}\`\n\n`;

  if (results.length > 0) {
    summary += '| Rule | File | Line |\n';
    summary += '| :--- | :--- | ---: |\n';
    for (const result of results.slice(0, 10)) {
      const location = result.locations?.[0]?.physicalLocation;
      const file = location?.artifactLocation?.uri;
      const line = location?.region?.startLine;
      summary += `| \`${escapeMarkdown(result.ruleId)}\` | \`${escapeMarkdown(file)}\` | ${Number.isInteger(line) ? line : '—'} |\n`;
    }
    if (results.length > 10) {
      summary += `\n*Showing the first 10 findings. See the SARIF report for all ${results.length} findings.*\n`;
    }
  }

  fs.appendFileSync(summaryPath, `${summary}\n`);
} catch (error) {
  console.warn(`Unable to write GitLeak Radar job summary: ${error.message}`);
}
        NODE
        fi

        if [ "$EXIT_CODE" -eq 2 ]; then
          echo "::error::GitLeak Radar encountered a tool error (exit code 2)."
          exit 2
        fi

        if [ "$EXIT_CODE" -eq 1 ] && [ "$INPUT_FAIL_ON_FINDINGS" = "true" ]; then
          exit 1
        fi

        exit 0

    - name: Upload SARIF to GitHub Security tab
      if: always() && inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@fddeee1a7ece751b577e409a89057319e3172939 # v4
      with:
        sarif_file: ${{ inputs.sarif-file }}

    - name: Upload SARIF artifact
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.sarif-file }}
        if-no-files-found: ignore

    - name: Post PR Comment
      if: always() && inputs.pr-comment == 'true' && github.event_name == 'pull_request' && inputs.github-token != ''
      uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
      with:
        github-token: ${{ inputs.github-token }}
      env:
        SARIF_PATH: ${{ inputs.sarif-file }}
        script: |
          const fs = require('fs');
          const sarifPath = process.env.SARIF_PATH;
          let findingsCount = 0;
          let results = [];

          if (fs.existsSync(sarifPath)) {
            try {
              const sarif = JSON.parse(fs.readFileSync(sarifPath, 'utf8'));
              results = sarif.runs?.[0]?.results || [];
              findingsCount = results.length;
            } catch (e) {
              console.log('Failed to parse SARIF for PR comment:', e.message);
            }
          }

          const tableValue = (value) => String(value ?? 'unknown')
            .replace(/[`|\\\r\n]/g, (character) => `\\${character}`);

          let body = '### 🛡️ GitLeak Radar Security Scan Report\n\n';
          if (findingsCount === 0) {
            body += '✅ **No secrets detected!** Your code is clean and secure.\n';
          } else {
            body += `⚠️ **Found ${findingsCount} potential secret(s) in this Pull Request.**\n\n`;
            body += '| Severity | Rule ID | File | Location |\n';
            body += '| :--- | :--- | :--- | :--- |\n';
            for (const r of results.slice(0, 10)) {
              const ruleId = tableValue(r.ruleId);
              const level = r.level === 'error' ? '🔴 Critical/High' : '🟡 Warning';
              const loc = r.locations?.[0]?.physicalLocation;
              const file = tableValue(loc?.artifactLocation?.uri);
              const line = Number.isInteger(loc?.region?.startLine) ? loc.region.startLine : 1;
              body += `| ${level} | \`${ruleId}\` | \`${file}\` | Satır ${line} |\n`;
            }
            if (findingsCount > 10) {
              body += `\n*...ve ${findingsCount - 10} bulgu daha (ayrıntılar için Security sekmesine veya CI loglarına bakın).*`;
            }
          }

          body += '\n\n---\n*Scanned automatically with [GitLeak Radar](https://github.com/gecekusu1979/gitleak-radar)*';

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const botComment = comments.find(c => c.body.includes('GitLeak Radar Security Scan Report'));

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }
